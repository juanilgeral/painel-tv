<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Juanil</title>
<style>
:root{
  --bg:#07162b; --bg2:#0e2f57; --card:rgba(255,255,255,.08); --line:rgba(255,255,255,.16);
  --accent:#f5a300; --text:#ffffff; --muted:#aebfd6;
  --ok:#2ecc71; --bad:#ff5a5f; --info:#3aa0ff; --urgent:#ff5a5f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:min(1.1vw,1.95vh)}
body{
  width:100vw;height:100vh;overflow:hidden;cursor:none;color:var(--text);
  font-family:"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(circle at 20% 0%,var(--bg2) 0%,var(--bg) 70%);
  display:grid;grid-template-rows:auto 1fr auto;
}
/* ---------- Cabeçalho ---------- */
header{display:flex;align-items:center;justify-content:space-between;padding:1rem 2.4rem;border-bottom:.15rem solid var(--accent);background:rgba(0,0,0,.25)}
.marca{display:flex;align-items:center;gap:1.2rem}
#logo{height:4.2rem;border-radius:.5rem;background:#fff;padding:.2rem}
.marca h1{font-size:2rem;font-weight:800;letter-spacing:.04em;line-height:1}
.marca small{display:block;font-size:1.1rem;color:var(--muted);font-weight:400;letter-spacing:.12em;text-transform:uppercase;margin-top:.3rem}
.relogio{display:flex;align-items:center;gap:2rem;text-align:right}
#radioTag{font-size:1.2rem;color:var(--accent);font-weight:700;letter-spacing:.1em}
#hora{font-size:3.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#data{font-size:1.2rem;color:var(--muted);margin-top:.2rem}
/* ---------- Palco ---------- */
#stage{position:relative;overflow:hidden}
.scene{position:absolute;inset:0;padding:1.8rem 2.6rem;display:flex;flex-direction:column;opacity:0;transition:opacity .5s}
.scene.on{opacity:1}
.scene.midia{padding:0;background:#000}
.titulo-cena{font-size:2.4rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;margin-bottom:1.4rem}
/* ---------- Avisos ---------- */
.aviso{flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--card);border-left:1rem solid var(--accent);border-radius:1.6rem;padding:3rem 4rem}
.aviso.tipo-urgente{border-color:var(--urgent)}
.aviso.tipo-info{border-color:var(--info)}
.aviso-tag{align-self:flex-start;background:var(--accent);color:#111;font-weight:800;padding:.4rem 1.3rem;border-radius:99px;letter-spacing:.12em;font-size:1.3rem;margin-bottom:1.6rem;text-transform:uppercase}
.aviso.alta .aviso-tag{background:var(--urgent);color:#fff;animation:pulso 1.6s infinite}
.aviso h1{font-size:5rem;line-height:1.1;margin-bottom:1.6rem}
.aviso p{line-height:1.3;white-space:pre-line;color:#e8f0fb}
@keyframes pulso{50%{opacity:.55}}
/* ---------- Notícias ---------- */
.noticia{flex:1;display:grid;grid-template-columns:1.05fr 1fr;gap:2.6rem;align-items:center;min-height:0}
.noticia-img{align-self:stretch;border-radius:1.6rem;overflow:hidden;background:#000;min-height:0}
.noticia-img img{width:100%;height:100%;object-fit:cover;display:block}
.noticia-tag{display:inline-block;background:var(--accent);color:#111;font-weight:800;padding:.35rem 1.1rem;border-radius:99px;font-size:1.2rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:1.2rem}
.noticia h1{font-size:3.7rem;line-height:1.12;margin-bottom:1.4rem}
.noticia p{font-size:1.8rem;line-height:1.35;color:var(--muted)}
.noticia .quando{margin-top:1.2rem;font-size:1.3rem;color:var(--accent)}
/* ---------- Clima ---------- */
.clima-main{display:flex;gap:2rem;align-items:stretch;margin-bottom:1.6rem}
.clima-agora{flex:1.2;display:flex;align-items:center;gap:2rem;background:var(--card);border-radius:1.6rem;padding:1.6rem 2.4rem}
.clima-agora .emoji{font-size:8rem;line-height:1}
.clima-agora .temp{font-size:7.5rem;font-weight:800;line-height:1}
.clima-agora .desc{font-size:2.2rem;color:var(--muted);margin-top:.4rem}
.clima-det{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.clima-det div{background:var(--card);border-radius:1.2rem;padding:1rem 1.4rem;font-size:1.3rem;color:var(--muted)}
.clima-det b{display:block;font-size:2.2rem;color:var(--text);margin-top:.2rem}
.clima-dias{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem}
.dia{background:var(--card);border-radius:1.4rem;padding:1.2rem 1.6rem;text-align:center}
.dia .nome{font-size:1.5rem;color:var(--accent);text-transform:capitalize;font-weight:700}
.dia .emoji{font-size:3.6rem;margin:.2rem 0}
.dia .mm{font-size:1.9rem;font-weight:700}
.dia .chuva{font-size:1.2rem;color:var(--muted)}
/* ---------- Mercado ---------- */
.mercado-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:1.8rem;align-items:center}
.moeda{background:var(--card);border-radius:1.8rem;padding:2.4rem 2rem;text-align:center;border-top:.5rem solid var(--accent)}
.moeda .nome{font-size:1.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.moeda .valor{font-size:4.2rem;font-weight:800;margin:1rem 0}
.moeda .var{font-size:2rem;font-weight:700}
.var.up{color:var(--ok)} .var.down{color:var(--bad)}
.rodinha{margin-top:1rem;font-size:1.2rem;color:var(--muted);text-align:right}
/* ---------- Aniversariantes ---------- */
.aniv-grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:1.1rem;align-content:start}
.aniv{display:flex;align-items:center;gap:1.4rem;background:var(--card);border-radius:1.4rem;padding:1rem 1.6rem}
.aniv .dia-num{flex:none;width:4.6rem;height:4.6rem;border-radius:50%;background:var(--accent);color:#111;font-weight:800;font-size:2rem;display:flex;align-items:center;justify-content:center}
.aniv .nome{font-size:2rem;font-weight:700}
.aniv .setor{font-size:1.3rem;color:var(--muted)}
.aniv.hoje{border:.2rem solid var(--accent);background:rgba(245,163,0,.15)}
.aniv .hoje-tag{margin-left:auto;background:var(--accent);color:#111;font-weight:800;font-size:1.2rem;padding:.3rem .9rem;border-radius:99px}
.pagina{margin-top:.8rem;text-align:right;color:var(--muted);font-size:1.2rem}
/* ---------- Funcionário do mês ---------- */
.func{flex:1;display:flex;align-items:center;gap:4rem;padding:0 2rem}
.func-foto{flex:none;width:25rem;height:25rem;border-radius:50%;border:.5rem solid var(--accent);overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center}
.func-foto img{width:100%;height:100%;object-fit:cover}
.func-foto .ph{font-size:8rem;font-weight:800;color:var(--accent)}
.func-txt .mes{font-size:1.6rem;color:var(--muted);text-transform:capitalize;margin-bottom:.4rem}
.func-txt h1{font-size:5rem;line-height:1.05;margin-bottom:.8rem}
.func-txt .cargo{font-size:2.2rem;color:var(--accent);font-weight:700;margin-bottom:1.4rem}
.func-txt .motivo{font-size:2rem;line-height:1.35;color:#e8f0fb;max-width:60rem}
/* ---------- Mídia ---------- */
.midia .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(30px) brightness(.45);transform:scale(1.1)}
.midia img.fg{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.midia video,.midia iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:contain}
/* ---------- Splash/vazio ---------- */
.centro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1rem;color:var(--muted);font-size:2rem}
.centro img{height:10rem;background:#fff;border-radius:1rem;padding:.4rem}
/* ---------- Rodapé ---------- */
footer{border-top:.15rem solid var(--accent);background:rgba(0,0,0,.35);height:3.6rem;display:flex;align-items:center;overflow:hidden}
#ticker{flex:1;overflow:hidden;white-space:nowrap}
#tickerTrack{display:flex;width:max-content;animation:tick linear infinite}
.grp{display:flex;flex-shrink:0}
.ft-item{font-size:1.6rem;padding-right:3rem;display:flex;align-items:center}
.ft-item b{background:var(--accent);color:#111;padding:.15rem .8rem;border-radius:.4rem;margin-right:.9rem;font-size:1.3rem;letter-spacing:.08em}
.ft-item::after{content:"\25C6";color:var(--accent);margin-left:3rem}
@keyframes tick{to{transform:translateX(-50%)}}
/* ---------- Desbloqueio do rádio ---------- */
#unlock{position:fixed;right:1.2rem;bottom:4.6rem;background:var(--accent);color:#111;font-weight:800;padding:.7rem 1.4rem;border-radius:99px;font-size:1.3rem;display:none;z-index:9}
</style>
</head>

async function fetchText(url, ms = 15000) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(url, { signal: c.signal, cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status + " " + url.split("?")[0]);
    return await r.text();
  } finally { clearTimeout(t); }
}

function parseCSV(t) {
  const rows = []; let row = [], f = "", q = false;
  t = t.replace(/^\uFEFF/, "");
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && t[i + 1] === "\n") i++;
      row.push(f); f = ""; rows.push(row); row = [];
    }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows;
}

function toObjects(rows) {
  if (!rows.length) return [];
  const head = rows[0].map(h => norm(h).replace(/\s+/g, "_"));
  return rows.slice(1)
    .filter(r => r.some(c => String(c).trim() !== ""))
    .map(r => { const o = {}; head.forEach((h, i) => { if (h) o[h] = String(r[i] ?? "").trim(); }); return o; });
}

function parseData(s) {
  s = String(s || "").trim();
  let m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[2] - 1, +m[1]); }
  m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  return null;
}

function driveId(u) {

/* ----- Notícias (RSS) ----- */
function limpar(html) {
  try { return (new DOMParser().parseFromString(String(html || ""), "text/html").body.textContent || "").replace(/\s+/g, " ").trim(); }
  catch (e) { return ""; }
}
const primeiraImg = h => { const m = String(h || "").match(/<img[^>]+src=["']([^"']+)/i); return m ? m[1] : ""; };

async function fetchRSS(url) {
  try {
    const j = JSON.parse(await fetchText("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url), 15000));
    if (j.status === "ok" && j.items && j.items.length) {
      return j.items.map(it => {
        const enc = it.enclosure && it.enclosure.link;
        const encImg = enc && /\.(jpe?g|png|webp|gif)/i.test(enc) ? enc : "";
        return {
          titulo: it.title || "", desc: limpar(it.description || it.content),
          img: it.thumbnail || encImg || primeiraImg(it.description || it.content), data: it.pubDate || ""
        };
      });
    }
  } catch (e) { console.warn("rss2json falhou", e.message); }
  try {
    const xml = await fetchText("https://api.allorigins.win/raw?url=" + encodeURIComponent(url), 15000);
    const doc = new DOMParser().parseFromString(xml, "text/xml");
    return [...doc.querySelectorAll("item")].map(it => {
      const g = t => { const e = it.getElementsByTagName(t)[0]; return e ? e.textContent : ""; };
      const mc = it.getElementsByTagNameNS("*", "content")[0] || it.getElementsByTagNameNS("*", "thumbnail")[0];
      const desc = g("description");
      return { titulo: g("title"), desc: limpar(desc), img: (mc && mc.getAttribute("url")) || primeiraImg(desc), data: g("pubDate") };
    });
  } catch (e) { console.warn("allorigins falhou", e.message); }
  return [];
}

function tipoMidia(m) {
  m = String(m || "");
  if (/^image\/(jpeg|png|webp|gif|bmp)/.test(m)) return "foto";
  if (/^video\/(mp4|webm|ogg|3gpp)/.test(m)) return "video";
  if (m === "application/vnd.google-apps.presentation") return "slides";
  if (/presentationml|ms-powerpoint|application\/pdf/.test(m)) return "doc";
  return null;
}
async function updMidia() {
  if (!DRIVE_API_KEY || DRIVE_API_KEY === "COLE_A_CHAVE_AQUI") { console.warn("Chave do Drive não configurada."); return; }
  let files = [], token = "";
  do {
    const u = "https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent("'" + DRIVE_PASTA_ID + "' in parents and trashed=false") +
      "&fields=" + encodeURIComponent("nextPageToken,files(id,name,mimeType)") +
      "&orderBy=name&pageSize=200&key=" + DRIVE_API_KEY + (token ? "&pageToken=" + token : "");
    const j = JSON.parse(await fetchText(u, 20000));
    files = files.concat(j.files || []); token = j.nextPageToken || "";
  } while (token);
  S.midia = files.filter(f => tipoMidia(f.mimeType));
}

  if (c === 2) return ["⛅", "Parcialmente nublado"];
  if (c === 3) return ["☁️", "Nublado"];
  if (c === 45 || c === 48) return ["🌫️", "Neblina"];
  if (c >= 51 && c <= 57) return ["🌦️", "Garoa"];
  if (c >= 61 && c <= 67) return ["🌧️", "Chuva"];

function parseDataNoticia(s) {
  s = String(s || "");
  if (/^\d{4}-\d\d-\d\d \d\d:\d\d/.test(s)) return new Date(s.replace(" ", "T") + "Z");
  return new Date(s);
}
function haQuanto(s) {
  const d = parseDataNoticia(s);
  if (!d || isNaN(d)) return "";
  const min = Math.round((Date.now() - d) / 60000);
  if (min < 0) return "";
  if (min < 60) return "há " + Math.max(min, 1) + " min";
  const h = Math.floor(min / 60);
  if (h < 24) return "há " + h + " h";
  const dd = Math.floor(h / 24);
  return "há " + dd + (dd === 1 ? " dia" : " dias");
}

}

function cenaFunc() {
  const hoje = new Date();
  const r = S.func.find(x => isYes(x.ATIVO) && x.NOME && mesConfere(x.MES_REFERENCIA, hoje));
  if (!r) return null;
  const id = driveId(r.FOTO_LINK);
  const foto = id ? "https://lh3.googleusercontent.com/d/" + id + "=w900" : (/^https?:\/\//i.test(r.FOTO_LINK || "") ? r.FOTO_LINK : "");
  const ini = r.NOME.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join("").toUpperCase();
  const mesTxt = cap(hoje.toLocaleDateString("pt-BR", { month: "long", year: "numeric" }));
  return {
    dur: cn("TEMPO_FUNC_MES_SEG", 20) * 1000,
    html: '<div class="titulo-cena">Funcionário do mês</div><div class="func"><div class="func-foto">' +
      (foto ? '<img src="' + esc(foto) + '" alt="">' : '<div class="ph">' + esc(ini) + "</div>") + '</div><div class="func-txt">' +
      '<div class="mes">' + esc(mesTxt) + "</div><h1>" + esc(r.NOME) + "</h1>" +
      '<div class="cargo">' + esc([r.CARGO, r.SETOR].filter(Boolean).join(" · ")) + "</div>" +
      (r.MOTIVO ? '<div class="motivo">' + esc(r.MOTIVO) + "</div>" : "") + "</div></div>",
    mount: el => {
      const img = el.querySelector(".func-foto img");
      if (img) img.onerror = () => { img.parentNode.innerHTML = '<div class="ph">' + esc(ini) + "</div>"; };
    }
  };
}

/* ----- Mídia ----- */
function cenaFoto(f) {
  const dur = cn("TEMPO_FOTO_SEG", 10) * 1000;
  const u1 = "https://lh3.googleusercontent.com/d/" + f.id + "=w1920";
  const u2 = "https://drive.google.com/thumbnail?id=" + f.id + "&sz=w1920";
  return {
    cls: "midia", html: '<div class="bg"></div><img class="fg" alt="">',
    run: el => new Promise(res => {
      const img = el.querySelector("img"), bg = el.querySelector(".bg");
      let ok = false, fb = false;
      img.onload = () => { if (ok) return; ok = true; bg.style.backgroundImage = 'url("' + img.src + '")'; setTimeout(res, dur); };
      img.onerror = () => { if (!fb) { fb = true; img.src = u2; } else res(); };
      img.src = u1;
      setTimeout(() => { if (!ok) res(); }, 20000);
    })
  };
}

function cenaVideo(f) {
  return {
    cls: "midia", max: 900000, html: '<video playsinline preload="auto"></video>',
    run: async el => {
      radioSuspender(true);
      try {
        await new Promise(res => {
          const v = el.querySelector("video");
          let fim = false, tocou = false, fb = false;
          const sair = () => { if (!fim) { fim = true; res(); } };
          const fallback = () => {
            if (fb || fim) return; fb = true;
            el.innerHTML = '<iframe src="https://drive.google.com/file/d/' + f.id + '/preview" allow="autoplay"></iframe>';
            setTimeout(sair, 45000);
          };
          v.onplaying = () => { tocou = true; };
          v.onended = sair; v.onerror = fallback;
          v.src = "https://www.googleapis.com/drive/v3/files/" + f.id + "?alt=media&key=" + DRIVE_API_KEY;
          const p = v.play();
          if (p && p.catch) p.catch(() => { v.muted = true; const q = v.play(); if (q && q.catch) q.catch(() => {}); });
          setTimeout(() => { if (!tocou) fallback(); }, 25000);
        });
      } finally { radioSuspender(false); }
    }
  };
}

function cenaSlides(f, t) {
  const url = t === "slides"
    ? "https://docs.google.com/presentation/d/" + f.id + "/embed?start=true&loop=true&delayms=5000&rm=minimal"
    : "https://drive.google.com/file/d/" + f.id + "/preview";
  return { cls: "midia", dur: cn("TEMPO_SLIDES_SEG", 60) * 1000, html: '<iframe src="' + esc(url) + '" allow="autoplay; fullscreen"></iframe>' };
}

function cenasMidia() {
  return S.midia.map(f => {
    const t = tipoMidia(f.mimeType);
    return t === "foto" ? cenaFoto(f) : t === "video" ? cenaVideo(f) : cenaSlides(f, t);
  });
}

const cenaVazia = () => ({
  dur: 6000,
  html: '<div class="centro"><img src="Logo.jpg" alt="" onerror="this.style.display=\'none\'"><div>Juanil Transportes e Locações</div></div>'
});

/* ===== PLAYLIST E MOTOR DE CENAS ===== */
function montarPlaylist() {
  const base = [], normais = [], altas = [];
  if (cb("MOSTRAR_AVISOS", true)) {
    avisosAtivos().forEach(a => (norm(a.PRIORIDADE) === "ALTA" ? altas : normais).push(a));
  }
  normais.forEach(a => base.push(cenaAviso(a, false)));
  if (cb("MOSTRAR_INDICES", true)) {
    if (S.clima) base.push(cenaClima());
    if (S.mercado) base.push(cenaMercado());
  }
  if (cb("MOSTRAR_NOTICIAS", true)) cenasNoticias().forEach(c => base.push(c));
  if (cb("MOSTRAR_ANIVERSARIANTES", true)) cenasAniv().forEach(c => base.push(c));
  if (cb("MOSTRAR_FUNC_MES", true)) { const c = cenaFunc(); if (c) base.push(c); }
  if (cb("MOSTRAR_MIDIA_DRIVE", true)) cenasMidia().forEach(c => base.push(c));

  if (!altas.length) return base;
  if (!base.length) return altas.map(a => cenaAviso(a, true));
  const n = Math.max(1, Math.round(cn("AVISO_IMPORTANTE_REPETE_A_CADA", 3)));
  const out = [];
  base.forEach((sc, i) => {
    if (i % n === 0) out.push(cenaAviso(altas[altaPtr++ % altas.length], true));
    out.push(sc);
  });
  return out;
}

const stage = $("#stage");
function limparCena(el) {
  el.querySelectorAll("video").forEach(v => { v.onerror = null; v.onended = null; v.pause(); v.removeAttribute("src"); });
  el.querySelectorAll("iframe").forEach(f => { f.src = "about:blank"; });
}

async function playScene(sc) {
  const old = stage.firstElementChild;
  if (old) { old.classList.remove("on"); await sleep(450); limparCena(old); old.remove(); }
  const el = document.createElement("div");
  el.className = "scene " + (sc.cls || "");
  el.innerHTML = sc.html;
  stage.appendChild(el);
  if (sc.mount) sc.mount(el);
  await sleep(40);
  el.classList.add("on");
  if (sc.run) await Promise.race([sc.run(el), sleep(sc.max || 600000)]);
  else await sleep(sc.dur);
}

async function ciclo() {
  while (true) {
    try {
      const lista = montarPlaylist();
      const v = versionUrgent;
      if (!lista.length) { await playScene(cenaVazia()); continue; }
      for (const sc of lista) {
        if (v !== versionUrgent) break;
        await playScene(sc);
      }
    } catch (e) { console.error(e); await sleep(3000); }
  }
}

/* ===== AUTO-ATUALIZAÇÃO DO PRÓPRIO PAINEL ===== */
let versaoBase = null;
async function checarVersao() {
  try {
    const t = await fetchText(location.origin + location.pathname + "?v=" + Date.now(), 15000);
    const h = hashStr(t);
    if (versaoBase === null) versaoBase = h;
    else if (h !== versaoBase) recarregar();
  } catch (e) {}
}

function recargaDiaria() {
  const d = new Date();
  if (d.getHours() !== 4) return;
  const hojeStr = d.toDateString();
  try {
    if (localStorage.getItem("juanil_reload_dia") === hojeStr) return;
    localStorage.setItem("juanil_reload_dia", hojeStr);
  } catch (e) { return; }
  recarregar();
}

/* ===== INÍCIO ===== */
const seguro = (fn) => () => { Promise.resolve().then(fn).catch(e => console.warn(e.message)); };

(async function iniciar() {
  relogio(); setInterval(relogio, 1000);

  await Promise.race([
    Promise.allSettled([updControle(), updSheets(), updNoticias(), updClima(), updMercado(), updMidia()]),
    sleep(20000)
  ]);

  setInterval(seguro(updControle), 30 * 1000);
  setInterval(seguro(updSheets), 60 * 1000);
  setInterval(seguro(updMercado), 3 * 60 * 1000);
  setInterval(seguro(updNoticias), 10 * 60 * 1000);
  setInterval(seguro(updMidia), 10 * 60 * 1000);
  setInterval(seguro(updClima), 15 * 60 * 1000);
  setInterval(seguro(checarVersao), 5 * 60 * 1000);
  setInterval(recargaDiaria, 60 * 1000);
  checarVersao();

  ciclo();
})();
})();
</script>
