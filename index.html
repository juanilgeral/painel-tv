<style>
:root{--bg:#07162b;--bg2:#0e2f57;--card:rgba(255,255,255,.09);--accent:#f5a300;--text:#fff;--muted:#b7c7dc;--ok:#2ecc71;--bad:#ff5a5f;--info:#3aa0ff}
*{box-sizing:border-box;margin:0;padding:0}html{font-size:min(1.1vw,1.95vh)}body{width:100vw;height:100vh;overflow:hidden;color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg) 70%);display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 2.1rem;border-bottom:.15rem solid var(--accent);background:#0004;gap:1rem}.marca,.relogio{display:flex;align-items:center;gap:1rem}.marca img{width:auto;height:auto;max-width:none;max-height:4.4rem;border-radius:.5rem}.marca h1{font-size:2rem;line-height:1}.marca small{display:block;color:var(--muted);font-size:1rem;letter-spacing:.1em;margin-top:.25rem}.relogio{margin-left:auto;text-align:right;gap:1.2rem}#hora{font-size:3rem;font-weight:800;line-height:1}#data{font-size:1rem;color:var(--muted);margin-top:.25rem}#radioTag{color:var(--accent);font-size:1rem;font-weight:700}button{font:inherit;cursor:pointer;border:0}.radio-btn{background:var(--accent);color:#151515;border-radius:99px;padding:.65rem 1rem;font-size:1rem;font-weight:800;white-space:nowrap}.radio-btn.off{background:#45556b;color:white}.radio-btn:active{transform:scale(.97)}
#stage{position:relative;overflow:hidden}.scene{position:absolute;inset:0;padding:1.5rem 2.5rem;display:flex;flex-direction:column;opacity:0;transition:opacity .45s;overflow:hidden}.scene.on{opacity:1}.scene.midia{padding:0;background:#000}.title{font-size:2.2rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1rem}.card{background:var(--card);border-radius:1.2rem;padding:1.5rem}.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1rem;color:var(--muted);font-size:2rem}.center img{width:auto;height:auto;max-width:none;max-height:none;border-radius:.8rem}
.notice{flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--card);border-left:.8rem solid var(--accent);border-radius:1.4rem;padding:2.5rem 3.5rem}.notice.urgent{border-color:var(--bad)}.tag{display:inline-block;align-self:flex-start;background:var(--accent);color:#111;font-weight:800;padding:.35rem 1rem;border-radius:99px;font-size:1.1rem;letter-spacing:.08em;margin-bottom:1rem}.notice.urgent .tag{background:var(--bad);color:white}.notice h1{font-size:4rem;line-height:1.05;margin-bottom:1rem}.notice p{font-size:2rem;line-height:1.3;white-space:pre-line;color:#e8f0fb}
.news{flex:1;display:grid;grid-template-columns:1.05fr 1fr;gap:2rem;align-items:center;min-height:0}.news figure{height:100%;min-height:0;border-radius:1.2rem;overflow:hidden;background:#000}.news img{width:100%;height:100%;object-fit:cover}.news h1{font-size:3.1rem;line-height:1.12;margin:.5rem 0 1rem}.news p{font-size:1.5rem;line-height:1.35;color:var(--muted)}.small{color:var(--accent);font-size:1rem;margin-top:.8rem}

function parseCSV(t){const rows=[];let row=[],f='',q=false;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}else f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows}

const radioAllowed=()=>!radioSusp&&!radioExpired&&radioDrive===true;
function radioTag(text){const e=$('#radioTag');e.hidden=!text;e.textContent=text||''}

function stopRadio(){clearTimeout(radioTimer);try{audio.pause();audio.removeAttribute('src');audio.load()}catch(e){}buttonState()}
function savedRadioTimer(){try{return JSON.parse(localStorage.getItem(RADIO_TIMER_KEY)||'null')}catch(e){return null}}

function syncRadioTimer(isOn,minutes){const n=Number(minutes);radioMinutes=Number.isFinite(n)?Math.max(0,n):0;let state=savedRadioTimer();if(!isOn){state={on:false,startedAt:0,minutes:radioMinutes};radioStartedAt=0;radioExpired=false;saveRadioTimer(state);return}if(!state||!state.on||!Number(state.startedAt)){state={on:true,startedAt:Date.now(),minutes:radioMinutes}}else{state={on:true,startedAt:Number(state.startedAt),minutes:radioMinutes}}radioStartedAt=state.startedAt;radioExpired=radioMinutes>0&&Date.now()-radioStartedAt>=radioMinutes*60000;saveRadioTimer(state)}
function unmuteOnGesture(){
  const go=()=>{
    audio.muted=false;
    audio.volume=Math.max(0,Math.min(1,cn('RADIO_VOLUME',50)/100));

    document.removeEventListener('pointerdown',go);
    document.removeEventListener('keydown',go);
  };
  document.addEventListener('pointerdown',go);
  document.addEventListener('keydown',go);
}
function startRadio(){
  if(!radioAllowed()){
    if(radioExpired) radioTag('JB FM · tempo configurado encerrado');
    buttonState();
    return;
  }
  audio.volume=Math.max(0,Math.min(1,cn('RADIO_VOLUME',50)/100));
  audio.muted=false;
  if(!audio.src){
    radioTries++;
    audio.src=radioTries>1?RADIO_URL+(RADIO_URL.includes('?')?'&':'?')+'t='+Date.now():RADIO_URL;
    try{audio.load()}catch(e){}
  }
  let p;
  try{p=audio.play()}catch(e){p=Promise.reject(e)}
  if(p?.then){
    p.then(()=>{
      radioTag('♪ JB FM AO VIVO');
    }).catch(err=>{
      console.warn('JB FM:',err.name,err.message);
      radioTag('JB FM conectando…');
      clearTimeout(radioTimer);
      radioTimer=setTimeout(startRadio,3000);
    });
  }
  buttonState();
}
function applyRadio(){if(radioDrive===false){stopRadio();radioTag('');return}if(radioExpired){stopRadio();radioTag('JB FM · tempo configurado encerrado');return}if(radioAllowed()){audio.volume=Math.max(0,Math.min(1,cn('RADIO_VOLUME',50)/100));if(audio.paused)startRadio()}buttonState()}
function checkRadioDeadline(){if(radioDrive!==true||!radioStartedAt||radioMinutes<=0||radioExpired)return;if(Date.now()-radioStartedAt>=radioMinutes*60000){radioExpired=true;saveRadioTimer({on:true,startedAt:radioStartedAt,minutes:radioMinutes});stopRadio();radioTag('JB FM · tempo configurado encerrado')}}

audio.addEventListener('playing',()=>{radioTries=0;radioLast=Date.now();radioTag('♪ JB FM AO VIVO');buttonState()});audio.addEventListener('waiting',()=>radioTag('♪ JB FM conectando…'));audio.addEventListener('timeupdate',()=>{if(audio.currentTime!==radioTime){radioTime=audio.currentTime;radioLast=Date.now()}});audio.addEventListener('error',()=>{if(radioAllowed()){radioTag('JB FM tentando reconectar…');clearTimeout(radioTimer);radioTimer=setTimeout(()=>{audio.removeAttribute('src');startRadio()},4000)}});audio.addEventListener('pause',buttonState);

function easterDate(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;return new Date(y,month-1,day)}
function nationalHolidays(y){const arr=[['01-01','Confraternização Universal'],['04-21','Tiradentes'],['05-01','Dia do Trabalho'],['09-07','Independência do Brasil'],['10-12','Nossa Senhora Aparecida'],['11-02','Finados'],['11-15','Proclamação da República'],['11-20','Dia Nacional de Zumbi e da Consciência Negra'],['12-25','Natal']];const easter=easterDate(y);const add=(d,off,label)=>{const x=new Date(d);x.setDate(x.getDate()+off);arr.push([String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'),label])};add(easter,-2,'Paixão de Cristo (Sexta-feira Santa)');add(easter,-48,'Carnaval (segunda-feira; ponto facultativo)');add(easter,-47,'Carnaval (terça-feira; ponto facultativo)');add(easter,60,'Corpus Christi (ponto facultativo)');return arr.sort((a,b)=>a[0].localeCompare(b[0]))}
function dateScene(){const now=new Date(),y=now.getFullYear(),key=String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');const hol=nationalHolidays(y).filter(x=>x[0]===key);const comm=y===2026?COMMEMORATIVE_2026[key]:'';const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());const upcoming=nationalHolidays(y).map(([d,n])=>({d,n,date:new Date(y,+d.slice(0,2)-1,+d.slice(3))})).filter(x=>x.date>=today).slice(0,6);const rows=upcoming.map(x=>'<div class="row"><span>'+esc(x.n)+'</span><b>'+x.date.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+'</b></div>').join('');return{dur:12000,html:'<div class="title">Feriados brasileiros e datas especiais</div><div class="rows">'+(hol.length?'<div class="row"><span>Feriado nacional hoje</span><b>'+esc(hol.map(x=>x[1]).join(', '))+'</b></div>':'')+(comm?'<div class="row"><span>Data comemorativa de hoje</span><b>'+esc(comm)+'</b></div>':'')+(rows||'<div class="row"><span>Sem feriado nacional restante neste ano</span></div>')+'</div><div class="small">Datas comemorativas curadas para 2026; revisar a lista anualmente. Carnaval e Corpus Christi são exibidos como pontos facultativos.</div>'}}
function moonInfo(date){const syn=29.530588853,ref=Date.UTC(2000,0,6,18,14),age=((date.getTime()-ref)/86400000%syn+syn)%syn,phase=age/syn;let i=Math.round(phase*8)%8;const names=['Lua nova','Lua crescente','Quarto crescente','Crescente gibosa','Lua cheia','Minguante gibosa','Quarto minguante','Lua minguante'];const emoji=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];return{age,name:names[i],emoji:emoji[i]}}

function cleanHtml(s){try{return new DOMParser().parseFromString(String(s||''),'text/html').body.textContent.replace(/\s+/g,' ').trim()}catch(e){return''}}
const firstImg=s=>{const m=String(s||'').match(/<img[^>]+src=["']([^"']+)/i);return m?m[1]:''};
async function rss(url){try{const j=JSON.parse(await fetchText('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url)));if(j.status==='ok'&&j.items)return j.items.map(x=>({title:x.title||'',desc:cleanHtml(x.description||x.content),img:x.thumbnail||firstImg(x.description||x.content),date:x.pubDate||''}))}catch(e){console.warn('rss2json:',e.message)}try{const xml=await fetchText('https://api.allorigins.win/raw?url='+encodeURIComponent(url));const doc=new DOMParser().parseFromString(xml,'text/xml');return [...doc.querySelectorAll('item')].map(x=>({title:x.querySelector('title')?.textContent||'',desc:cleanHtml(x.querySelector('description')?.textContent||''),img:firstImg(x.querySelector('description')?.textContent||''),date:x.querySelector('pubDate')?.textContent||''}))}catch(e){console.warn('Fallback RSS:',e.message)}try{const xml=await fetchText('https://corsproxy.io/?url='+encodeURIComponent(url));const doc=new DOMParser().parseFromString(xml,'text/xml');return [...doc.querySelectorAll('item')].map(x=>({title:x.querySelector('title')?.textContent||'',desc:cleanHtml(x.querySelector('description')?.textContent||''),img:firstImg(x.querySelector('description')?.textContent||''),date:x.querySelector('pubDate')?.textContent||''}))}catch(e){console.warn('Segundo fallback RSS:',e.message);return[]}}

function wmo(n){if(n===0)return['☀️','Céu limpo'];if(n<=2)return['⛅','Parcialmente nublado'];if(n===3)return['☁️','Nublado'];if(n<=48)return['🌫️','Neblina'];if(n<=67)return['🌧️','Chuva'];if(n<=82)return['🌦️','Pancadas de chuva'];if(n>=95)return['⛈️','Tempestade'];return['🌡️','Tempo instável']}
function weatherScene(){const c=S.clima.current,d=S.clima.daily,[em,desc]=wmo(c.weather_code);const days=[1,2,3].map(i=>'<div class="day"><div class="name">'+new Date(d.time[i]+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long'})+'</div><div class="emoji">'+wmo(d.weather_code[i])[0]+'</div><div class="temps">'+Math.round(d.temperature_2m_min[i])+'° / '+Math.round(d.temperature_2m_max[i])+'°</div><div class="small">Chuva '+(d.precipitation_probability_max[i]??0)+'%</div></div>').join('');return{dur:cn('TEMPO_INDICES_SEG',8)*1000,html:'<div class="title">Clima · '+CLIMA.nome+'</div><div class="weather-main"><div class="weather-now"><div class="emoji">'+em+'</div><div><div class="temp">'+Math.round(c.temperature_2m)+'°</div><div class="desc">'+desc+'</div></div></div><div class="weather-details"><div>Sensação<b>'+Math.round(c.apparent_temperature)+'°</b></div><div>Umidade<b>'+Math.round(c.relative_humidity_2m)+'%</b></div><div>Vento<b>'+Math.round(c.wind_speed_10m)+' km/h</b></div><div>Hoje<b>'+Math.round(d.temperature_2m_min[0])+'° / '+Math.round(d.temperature_2m_max[0])+'°</b></div></div></div><div class="days">'+days+'</div>'}}
function marketScene(){const items=[['Dólar',S.mercado.usd,2],['Euro',S.mercado.eur,2],['Bitcoin',S.mercado.btc,0]];const cards=items.map(([n,o,d])=>{if(!o)return'';const p=parseFloat(o.pctChange),v=Number(o.bid).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:d,maximumFractionDigits:d});return'<div class="market"><div class="name">'+n+'</div><div class="value">'+v+'</div><div class="'+(p>=0?'up':'down')+'">'+(p>=0?'▲':'▼')+' '+Math.abs(p).toFixed(2).replace('.',',')+'%</div></div>'}).join('');return{dur:cn('TEMPO_INDICES_SEG',8)*1000,html:'<div class="title">Mercado financeiro</div><div class="market-grid">'+cards+'</div><div class="small" style="text-align:right">Atualizado às '+S.mercado.at.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</div>'}}
function noticeScenes(){const now=new Date();now.setHours(0,0,0,0);return S.avisos.filter(a=>yes(a.ATIVO)&&(a.TITULO||a.TEXTO)).filter(a=>{const i=parseDate(a.INICIO),f=parseDate(a.FIM);return(!i||i<=now)&&(!f||f>=now)}).map(a=>({dur:(norm(a.PRIORIDADE)==='ALTA'?cn('TEMPO_AVISO_IMPORTANTE_SEG',25):cn('TEMPO_AVISO_NORMAL_SEG',15))*1000,html:'<div class="notice '+(norm(a.PRIORIDADE)==='ALTA'?'urgent':'')+'"><span class="tag">'+esc(norm(a.PRIORIDADE)==='ALTA'?'AVISO ESPECIAL':a.TIPO||'AVISO')+'</span>'+(a.TITULO?'<h1>'+esc(a.TITULO)+'</h1>':'')+'<p>'+esc(a.TEXTO||'')+'</p></div>'}))}
function birthdayScenes(){const today=new Date(),list=S.aniv.filter(r=>yes(r.ATIVO)&&r.NOME).map(r=>({...r,d:parseDate(r.DATA_NASCIMENTO)})).filter(r=>r.d&&r.d.getMonth()===today.getMonth()).sort((a,b)=>a.d.getDate()-b.d.getDate());if(!list.length)return[];const chunks=[];for(let i=0;i<list.length;i+=8){const cards=list.slice(i,i+8).map(r=>'<div class="birthday '+(r.d.getDate()===today.getDate()?'today':'')+'"><div class="num">'+r.d.getDate()+'</div><div><strong>'+esc(r.NOME)+'</strong><small>'+esc(r.SETOR||'')+(r.d.getDate()===today.getDate()?' · HOJE':'')+'</small></div></div>').join('');chunks.push({dur:cn('TEMPO_ANIVERSARIANTES_SEG',15)*1000,html:'<div class="title">Aniversariantes de '+today.toLocaleDateString('pt-BR',{month:'long'})+'</div><div class="grid2">'+cards+'</div>'})}return chunks}
function employeeScene(){const today=new Date(),r=S.func.find(x=>yes(x.ATIVO)&&x.NOME);if(!r)return null;const id=driveId(r.FOTO_LINK),img=id?'https://lh3.googleusercontent.com/d/'+id+'=w900':(/^https?:/.test(r.FOTO_LINK||'')?r.FOTO_LINK:'');return{dur:cn('TEMPO_FUNC_MES_SEG',20)*1000,html:'<div class="title">Funcionário do mês</div><div class="func">'+(img?'<img class="photo" src="'+esc(img)+'" alt="">':'<div class="photo center">'+esc(r.NOME.split(/\s+/).slice(0,2).map(x=>x[0]).join(''))+'</div>')+'<div><div class="small">'+today.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'</div><h1>'+esc(r.NOME)+'</h1><div class="meta">'+esc([r.CARGO,r.SETOR].filter(Boolean).join(' · '))+'</div><p>'+esc(r.MOTIVO||'')+'</p></div></div>'}}
function channelScene(){return{dur:15000,html:'<div class="title">Canal interno · anônimo</div><div class="channel"><h1>Comunicado interno</h1><p>Espaço reservado para comunicados da Juanil. A imagem e o texto do comunicado serão inseridos quando forem enviados.</p></div>'}}
async function updateMedia(){if(!DRIVE_API_KEY)return;try{let files=[],token='';do{const u='https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent("'"+DRIVE_PASTA_ID+"' in parents and trashed=false")+'&fields='+encodeURIComponent('nextPageToken,files(id,name,mimeType)')+'&orderBy=name&pageSize=200&key='+DRIVE_API_KEY+(token?'&pageToken='+token:'');const j=JSON.parse(await fetchText(u,20000));files.push(...(j.files||[]));token=j.nextPageToken||''}while(token);S.midia=files.filter(f=>/^image\/(jpeg|png|webp|gif|bmp)/.test(f.mimeType)||/^video\/(mp4|webm|ogg|3gpp)/.test(f.mimeType)||/presentation|pdf/.test(f.mimeType))}catch(e){console.warn('Drive mídia:',e.message)}}
function mediaScenes(){return S.midia.map(f=>{if(/^image\//.test(f.mimeType)){const src='https://lh3.googleusercontent.com/d/'+f.id+'=w1920';return{cls:'midia',dur:cn('TEMPO_FOTO_SEG',10)*1000,html:'<div class="blur"></div><img class="fg" src="'+src+'" alt="'+esc(f.name)+'">',mount:el=>{const im=el.querySelector('img');im.onload=()=>el.querySelector('.blur').style.backgroundImage='url("'+im.src+'")';im.onerror=()=>{im.src='https://drive.google.com/thumbnail?id='+f.id+'&sz=w1920'}}}}if(/^video\//.test(f.mimeType))return{cls:'midia',dur:60000,html:'<video src="https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media&key='+DRIVE_API_KEY+'" autoplay playsinline controls></video>'};return{cls:'midia',dur:cn('TEMPO_SLIDES_SEG',60)*1000,html:'<iframe src="https://drive.google.com/file/d/'+f.id+'/preview" allow="autoplay; fullscreen"></iframe>'}})}
let lastTickerMarkup='';function renderTicker(){const list=S.rodape.filter(x=>yes(x.ATIVO)&&(x.TEXTO||x.MENSAGEM||x.COMUNICADO)).map(x=>({label:x.ROTULO||x.CATEGORIA||'',text:x.TEXTO||x.MENSAGEM||x.COMUNICADO}));const unit=list.map(x=>'<span class="ticker-item">'+(x.label?'<b>'+esc(x.label)+'</b>':'')+esc(x.text)+'</span>').join('');const t=$('#tickerTrack'),viewport=$('#ticker');if(unit===lastTickerMarkup)return;lastTickerMarkup=unit;t.style.animation='none';if(!unit){t.innerHTML='';return}t.innerHTML='<div class="ticker-group">'+unit+'</div><div class="ticker-group">'+unit+'</div>';const first=t.firstElementChild,base=first.innerHTML;let count=1;while(first.getBoundingClientRect().width<viewport.clientWidth+120&&count<16){first.insertAdjacentHTML('beforeend',base);count++}t.lastElementChild.innerHTML=first.innerHTML;void t.offsetWidth;const duration=Math.max(18,first.getBoundingClientRect().width/75);t.style.animation='tick '+duration+'s linear infinite'}
function clock(){const d=new Date();$('#hora').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});$('#data').textContent=cap(d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}
const stage=$('#stage');function sceneList(){const a=[];if(cb('MOSTRAR_AVISOS',true))a.push(...noticeScenes());if(cb('MOSTRAR_INDICES',true)){if(S.clima)a.push(weatherScene());if(S.mercado)a.push(marketScene())}if(cb('MOSTRAR_NOTICIAS',true))S.noticias.forEach(n=>a.push({dur:cn('TEMPO_NOTICIAS_SEG',12)*1000,html:'<div class="news">'+(n.img?'<figure><img src="'+esc(n.img)+'" onerror="this.parentNode.remove()"></figure>':'')+'<div>'+(n.source?'<span class="tag">'+esc(n.source)+'</span>':'')+'<h1>'+esc(n.title)+'</h1><p>'+esc((n.desc||'').slice(0,350))+'</p><div class="small">'+esc(n.date)+'</div></div></div>'}));if(cb('MOSTRAR_ANIVERSARIANTES',true))a.push(...birthdayScenes());if(cb('MOSTRAR_FUNC_MES',true)){const f=employeeScene();if(f)a.push(f)}if(cb('MOSTRAR_MIDIA_DRIVE',true))a.push(...mediaScenes());a.push(dateScene(),moonScene(),channelScene());if(!a.length)a.push({dur:8000,html:'<div class="center"><img src="Logo.jpg" alt=""><div>Juanil Transportes e Locações</div></div>'});return a}
async function playScene(s){const old=stage.firstElementChild;if(old){old.classList.remove('on');await sleep(400);old.querySelectorAll('video').forEach(v=>{v.pause();v.removeAttribute('src')});old.querySelectorAll('iframe').forEach(f=>f.src='about:blank');old.remove()}const el=document.createElement('div');el.className='scene '+(s.cls||'');el.innerHTML=s.html;stage.appendChild(el);s.mount?.(el);await sleep(40);el.classList.add('on');await sleep(s.dur||8000)}
async function cycle(){while(true){try{for(const s of sceneList())await playScene(s)}catch(e){console.error(e);await sleep(2500)}}}
/* Recarga sob demanda: executa uma vez neste aparelho por comando. A planilha publicada em CSV é somente leitura; para alterar a célula remotamente é necessário um endpoint de escrita autorizado. */
function checkReloadCommand(){const key='juanil_recarga_feita',on=norm(cv('RECARREGAR_PAINEL','NAO'))==='SIM';let marked=false;try{marked=localStorage.getItem(key)==='1'}catch(e){}if(!on){try{localStorage.removeItem(key)}catch(e){}}else if(!marked){try{localStorage.setItem(key,'1')}catch(e){}setTimeout(()=>location.reload(),500)}}
/* Verificação silenciosa a cada 5 min; recarga diária às 04:00 no fuso de São Paulo. */
let baseHash='';function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return s.length+':'+h}async function checkVersion(){try{const t=await fetchText(location.origin+location.pathname+'?v='+Date.now());const h=hash(t);if(!baseHash)baseHash=h;else if(h!==baseHash)location.reload()}catch(e){}}
let dailyMark='';function dailyReload(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const o=Object.fromEntries(parts.map(p=>[p.type,p.value]));const day=o.year+'-'+o.month+'-'+o.day;if(o.hour==='04'&&dailyMark!==day){dailyMark=day;location.reload()}}
async function updateSheets(){const names=['AVISOS','ANIVERSARIOS','FUNCIONARIO_MES','RODAPE'];const results=await Promise.allSettled(names.map(load));results.forEach((r,i)=>{if(r.status!=='fulfilled'){console.warn('Aba '+names[i]+':',r.reason?.message||r.reason);return}if(names[i]==='AVISOS')S.avisos=r.value;else if(names[i]==='ANIVERSARIOS')S.aniv=r.value;else if(names[i]==='FUNCIONARIO_MES')S.func=r.value;else if(names[i]==='RODAPE')S.rodape=r.value});renderTicker()}
const safe=f=>()=>Promise.resolve().then(f).catch(e=>console.warn(e.message));
(async()=>{clock();setInterval(clock,1000);try{await Promise.race([updateControl(),sleep(12000)])}catch(e){console.warn('Controle da rádio indisponível:',e.message)}setTimeout(applyRadio,1500);setTimeout(applyRadio,6000);setTimeout(applyRadio,12000);await Promise.allSettled([updateSheets(),updateNews(),updateWeather(),updateMarket(),updateMedia()]);setInterval(safe(updateControl),10000);setInterval(safe(updateSheets),60000);setInterval(safe(updateMarket),180000);setInterval(safe(updateNews),600000);setInterval(safe(updateMedia),600000);setInterval(safe(updateWeather),900000);setInterval(safe(checkVersion),300000);setInterval(dailyReload,60000);checkVersion();setInterval(checkRadioDeadline,1000);setInterval(()=>{if(radioAllowed()&&audio.paused)startRadio();else if(radioAllowed()&&Date.now()-radioLast>25000){audio.removeAttribute('src');radioTries=1;startRadio()}},12000);cycle()})();
})();
